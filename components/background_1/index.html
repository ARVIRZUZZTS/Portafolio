<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DyeWhorl · Winkode</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="ink-tank" aria-hidden="true">
            <canvas id="inkCanvas"></canvas>
        </div>
        <main class="main-content">
            <div class="content-container">
                <div class="page-header">
                    <div class="badge-tag">Background</div>
                    <h1 class="page-title">DyeWhorl</h1>
                    <p class="page-subtitle">
                        Tinta en fluido: solver Navier-Stokes con advección MacCormack,
                        flotabilidad por densidad y confinamiento de vorticidad.
                    </p>
                </div>
                <div class="stats-row">
                    <div class="metric-card">
                        <div class="metric-icon blue"><i data-lucide="waves"></i></div>
                        <div class="metric-info">
                            <span class="metric-label">Solver</span>
                            <span class="metric-value">WebGL1</span>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-icon green"><i data-lucide="droplets"></i></div>
                        <div class="metric-info">
                            <span class="metric-label">Advección</span>
                            <span class="metric-value">MacCormack</span>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-icon purple"><i data-lucide="wind"></i></div>
                        <div class="metric-info">
                            <span class="metric-label">Vorticidad</span>
                            <span class="metric-value">Confinement</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
